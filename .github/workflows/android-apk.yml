name: Build Ghoul Diner APK

# Manual only: run from the Actions tab ("Run workflow") when an APK is wanted.
# Pushes do NOT trigger a build, so no Actions minutes are used automatically.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghoul-diner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ghoul-diner-apk
          path: ghoul-diner/android/app/build/outputs/apk/debug/app-debug.apk
